# ============================================================
# NAV2 Parameters for Holonomic Robot
# ROS 2 Jazzy - VERSION CORRIGÉE
# ============================================================

# ============ AMCL (Adaptive Monte Carlo Localization) ============

amcl:
  ros__parameters:
    use_sim_time: false

    # ---- Input Configuration ----
    scan_topic: scan_merged

    # ---- Frame Configuration ----
    odom_frame_id: odom
    base_frame_id: base_link
    global_frame_id: map

    # ---- Motion Model ----
    robot_model_type: "nav2_amcl::OmniMotionModel"  # le robot est holonome

    # ---- Particle Filter Configuration ----
    min_particles: 500
    max_particles: 2000

    # ---- Update Thresholds ----
    update_min_d: 0.2
    update_min_a: 0.2

    # ---- Sensor Model ----
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    # ---- Laser Parameters ----
    laser_max_range: 20.0
    laser_min_range: 0.1

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    sigma_short: 0.05
    lambda_short: 0.1

    # ---- Resampling ----
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # ---- Recovery ----
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # ---- Transform ----
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # ---- Beam Search ----
    beam_search_increment: 0.05
    do_beamwise_likelihood: false

# ---- AMCL Client Configuration ----

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ============ MAP SERVER ============

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # À remplir après cartographie

# ============ PLANNER SERVER (Global Planner) ============

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ============ CONTROLLER SERVER (Local Path Following) ============

controller_server:
  ros__parameters:
    use_sim_time: false

    # ---- General Configuration ----
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    # ---- Plugin Configuration ----
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    use_realtime_priority: false

    # ---- Progress Checker ----
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # ---- Goal Checker ----
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful_success_timeout: 1.0

    # ---- Path Following Controller ----
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocity parameters
      desired_linear_vel: 0.4
      max_angular_accel: 3.0
      allow_reversing: false  # Holonome peut se déplacer sans marche arrière

      # Lookahead parameters
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      lookahead_time: 1.5

      use_velocity_scaled_lookahead_dist: true

      # Heading rotation
      rotate_to_heading_angular_vel: 1.8

      # Tolerance
      transform_tolerance: 0.2

      # Safety
      use_collision_detection: true
      max_allowed_time_error: 1.0
      max_robot_pose_search_dist: 2.0

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ============ LOCAL COSTMAP ============

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.25  # À adapter selon les mesures définitives du robot

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_merged
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

      always_send_full_costmap: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: false

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

# ============ GLOBAL COSTMAP ============

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false

      resolution: 0.05
      robot_radius: 0.25  # À adapter selon les mesures définitives du robot

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_merged
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: false

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

# ============ BT NAVIGATOR ============

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    default_nav_to_pose_bt_xml: nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_fibonacci_action_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ============ BEHAVIOR SERVER ============

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0

    recovery_plugins: ["spin", "back_up", "wait"]

    spin:
      plugin: "nav2_recoveries/Spin"
      simulate_ahead_time: 2.0
      max_rotations: 1
      max_effort: 100.0
      angular_dist_tolerance: 0.785

    back_up:
      plugin: "nav2_recoveries/BackUp"
      simulate_ahead_time: 2.0
      max_backup_dist: 0.15
      tf_timeout: 1.0
      failed_i_dist_tolerance: 0.05
      max_effort: 100.0

    wait:
      plugin: "nav2_recoveries/Wait"
      wait_duration: 2.0

# ============ ROBOT STATE PUBLISHER ============

robot_state_publisher:
  ros__parameters:
    use_sim_time: false